[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql-eval-toolkit"
version = "1.5.0"
description = "A toolkit for evaluating text-to-SQL pipelines"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
authors = [
    { name = "Oktie Hassanzadeh", email = "lastname@us.ibm.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = [
    "ibm_watsonx_ai>=1.3.30",
    "pandas>=2.2.3",
    "requests>=2.33.0",
    "sqlalchemy>=2.0.41",
    "sqlparse>=0.6.0",
    "psycopg2-binary>=2.9.10",
    "sqlglot>=27.0.0",
    "asyncpg>=0.30.0",
    "setuptools>=83.0.0",
    "loguru>=0.7.3",
    "func-timeout>=4.3.5",
    "tqdm>=4.67.1",
    "matplotlib>=3.10.5",
    "python-dotenv>=1.2.2",
    # langgraph and langchain-core were declared here and imported nowhere: the
    # agentic pipeline names LangGraph in its docstring but runs a hand-written
    # state machine, and the only `from langgraph...` line in the tree is
    # commented out. Between them they pulled langgraph-checkpoint,
    # langgraph-sdk, langgraph-prebuilt, langsmith and orjson into every install
    # -- six of the fifteen base packages that carried an open advisory in
    # 1.5.0. Removed rather than floored. Re-add them if the pipeline is ever
    # actually rebuilt on LangGraph.
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "huggingface_hub>=0.30,<1.0",

    # Security floors on packages this project does not import directly.
    #
    # Every one of these arrives through a dependency above, and every one of
    # them carried an open advisory against the base install. A lockfile fixes
    # that for this repository and for the container; it does nothing for
    # `pip install text2sql-eval-toolkit`, which resolves fresh against whatever
    # the intermediate package's own floor allows -- and those floors are years
    # behind. Naming the patched version here is the only thing that reaches
    # that install.
    #
    # These are floors, not pins: a newer version always wins. Remove an entry
    # once the package that pulls it in has raised its own floor past this one.
    "cryptography>=50.0.0",   # via google-auth; encrypts stored provider keys
    "idna>=3.15",             # via requests, httpx
    "pillow>=12.3.0",         # via matplotlib
    "pyasn1>=0.6.4",          # via pyasn1-modules <- google-auth
    "urllib3>=2.7.0",         # via requests, ibm-watsonx-ai
]

[project.optional-dependencies]
# Routes any provider LiteLLM knows, for model strings the native prefixes do
# not cover. An extra rather than a dependency: it pulls ~23 packages including
# boto3, and narrows the openai pin, which is a lot to impose on everyone who
# installs the library when the built-in prefixes already reach six providers.
litellm = [
  "litellm>=1.50",
]
# Building the documentation site. Not needed to use the toolkit.
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]
db2 = [
  "ibm-db>=3.2.6",
  "ibm-db-sa>=0.4.0",  # SQLAlchemy variant
  "sqlalchemy>=2.0"    # idem
]
mysql = [
  "pymysql>=1.1.1",
  "aiomysql>=0.2.0",
  "greenlet>=3.0.0",
  "cryptography>=50.0.0"
]
presto = [
  "pyhive>=0.7.0",
  "presto-python-client>=0.8.4"
]
# The four notebooks under notebooks/. The toolkit itself imports none of this;
# the extra exists so `pip install .[notebook]` gets a kernel that runs them.
# The floors below jupyter are security floors -- the jupyter metapackage's own
# constraints are wide enough to resolve a stack with a stored-XSS advisory in
# it, and nothing else in the chain would stop that.
notebook = [
  "jupyter>=1.1.1",
  "nbconvert>=7.17.1",
  # nbconvert's own floors on these are wide; both carry XSS and ReDoS fixes.
  "mistune>=3.3.0",
  "bleach>=6.4.0",
  "jupyter-server>=2.21.0",
  "jupyterlab>=4.6.0",
  "notebook>=7.6.0",
]
dashboard = [
  # Floored at the first FastAPI that accepts Starlette 1.x: the 0.x Starlette
  # line carries unfixed advisories that matter for a public deployment --
  # Host-header poisoning of request.url.path, and form() size limits silently
  # ignored. `starlette` is named alongside it because FastAPI's own floor is
  # wide enough to resolve back onto them.
  "fastapi>=0.141.1",
  "starlette>=1.3.1",
  "uvicorn[standard]>=0.30.0",
  # Google OIDC sign-in for shared deployments; unused in local (full) mode.
  "authlib>=1.3",
  "itsdangerous>=2.1",
  # MySQL async driver (Beaver benchmark); execution_tools uses mysql+aiomysql://
  "pymysql>=1.1.1",
  "aiomysql>=0.2.0",
  "greenlet>=3.0.0",
  "cryptography>=50.0.0"
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
  "black>=24.0.0",
  "mypy>=1.11.0",
  "types-PyYAML>=6.0",
  "types-requests>=2.32"
]

[project.scripts]
text2sql-eval-dashboard = "text2sql_eval_toolkit.ui.server:main"
text2sql-eval-toolkit = "text2sql_eval_toolkit.cli:main"

[project.urls]
# PyPI renders README.md as the project page and shows these in its sidebar; it
# does not host API documentation, so the reference is hosted and linked.
Homepage = "https://github.com/IBM/text2sql-eval-toolkit"
Documentation = "https://text2sql-eval-toolkit.readthedocs.io/"
Repository = "https://github.com/IBM/text2sql-eval-toolkit"
Changelog = "https://github.com/IBM/text2sql-eval-toolkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/IBM/text2sql-eval-toolkit/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"text2sql_eval_toolkit" = ["data/*.json"]
# The judge prompts are read at runtime by load_llm_judge_config(). Without
# this the wheel installs the judge code and none of its configuration, and
# every judge call raises FileNotFoundError on a pip install.
"text2sql_eval_toolkit.evaluation" = ["llm_judge_config/*.yaml"]
# The dashboard frontend. setup.py copies dashboard/dist here at build time --
# it lives outside the package, and package-data cannot reach outside one.
"text2sql_eval_toolkit.ui" = ["static/**/*"]


# ---------------------------------------------------------------------------
# Tooling
#
# Conventions previously documented in CONTRIBUTING.md but not enforced.
# ---------------------------------------------------------------------------

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = "dashboard/"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["dashboard", "notebooks", ".venv", "build", "dist"]

[tool.ruff.lint]
# Conservative starting set: pyflakes plus the pycodestyle rules that catch real
# errors rather than formatting noise (Black owns formatting).  Widen this
# deliberately -- adding `I` (import sorting) or `UP` (pyupgrade) rewrites many
# files and belongs in its own commit, not mixed with logic changes.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    # Assigned-but-unused is common in this codebase's step-by-step pipeline
    # code where intermediate values document the flow.  Revisit later.
    "F841",
    # FastAPI's `Query(...)` / `Body(...)` / `Depends(...)` parameter defaults are
    # the framework's documented idiom (21 uses in ui/server.py), not the bug
    # B008 describes.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Re-exports: __init__ files intentionally import names they do not use.
"__init__.py" = ["F401"]
"src/text2sql_eval_toolkit/__init__.py" = ["F401", "E402"]
# Scripts load .env before importing the toolkit, so imports follow code.
"scripts/**" = ["E402"]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Default run is hermetic: no network, no credentials, no databases.
# Opt in with `pytest -m integration` (and the env the tests document).
addopts = "-m 'not integration' --strict-markers"
markers = [
    "integration: requires live LLM/database credentials or network access",
]

[tool.mypy]
# Deliberately no `python_version` pin: forcing 3.11 makes mypy parse third-party
# stubs (numpy) under 3.11 rules, and those stubs use PEP 695 syntax, which
# aborts the run.  mypy therefore checks against the interpreter it runs on
# (3.13 in CI).  The 3.11 floor is enforced where it actually matters -- the test
# matrix runs on 3.11 -- which is a stronger guarantee than a static assumption.
# Narrow initial scope, widened module by module as annotations land.
files = [
    "src/text2sql_eval_toolkit/results",
    "src/text2sql_eval_toolkit/indexing",
    "src/text2sql_eval_toolkit/ui/aliases.py",
    "src/text2sql_eval_toolkit/utils.py",
    "src/text2sql_eval_toolkit/env_loader.py",
    "src/text2sql_eval_toolkit/config_args.py",
]
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["src/text2sql_eval_toolkit"]
omit = ["*/data/*"]

[tool.coverage.report]
# A project-wide backstop only.  It is low because most of the codebase is
# inference and execution paths that need live LLM and DB endpoints to
# exercise; raising it would mean either weak tests or a suite that cannot run
# offline.  The floors that matter are per module and live in
# scripts/ci/check_coverage.py, where each one has a stated reason.
fail_under = 43
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
