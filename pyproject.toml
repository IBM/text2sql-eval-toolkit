[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql-eval-toolkit"
version = "1.1.0"
description = "A toolkit for evaluating text-to-SQL pipelines"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
authors = [
    { name = "Oktie Hassanzadeh", email = "lastname@us.ibm.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = [
    "ibm_watsonx_ai>=1.3.30",
    "pandas>=2.2.3",
    "requests>=2.32.4",
    "sqlalchemy>=2.0.41",
    "sqlparse>=0.5.3",
    "psycopg2-binary>=2.9.10",
    "sqlglot>=27.0.0",
    "asyncpg>=0.30.0",
    "setuptools>=77.0.3",
    "loguru>=0.7.3",
    "func-timeout>=4.3.5",
    "tqdm>=4.67.1",
    "matplotlib>=3.10.5",
    "python-dotenv>=1.1.1",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "huggingface_hub>=0.30,<1.0"
]

[project.optional-dependencies]
db2 = [
  "ibm-db>=3.2.6",
  "ibm-db-sa>=0.4.0",  # SQLAlchemy variant
  "sqlalchemy>=2.0"    # idem
]
mysql = [
  "pymysql>=1.1.1",
  "aiomysql>=0.2.0",
  "greenlet>=3.0.0",
  "cryptography>=45.0.6"
]
presto = [
  "pyhive>=0.7.0",
  "presto-python-client>=0.8.4"
]
notebook = [
  "jupyter>=1.0.0",
  "nbconvert>=7.0.0"
]
dashboard = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  # MySQL async driver (Beaver benchmark); execution_tools uses mysql+aiomysql://
  "pymysql>=1.1.1",
  "aiomysql>=0.2.0",
  "greenlet>=3.0.0",
  "cryptography>=45.0.6"
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
  "black>=24.0.0",
  "mypy>=1.11.0",
  "types-PyYAML>=6.0",
  "types-requests>=2.32"
]

[project.scripts]
text2sql-eval-dashboard = "text2sql_eval_toolkit.ui.server:main"
text2sql-eval-toolkit = "text2sql_eval_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/IBM/text2sql-eval-toolkit"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"text2sql_eval_toolkit" = ["data/*.json"]


# ---------------------------------------------------------------------------
# Tooling
#
# Conventions previously documented in CONTRIBUTING.md but not enforced.
# See docs/plan/04-code-quality.md for the rationale behind each choice.
# ---------------------------------------------------------------------------

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = "dashboard/"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["dashboard", "notebooks", ".venv", "build", "dist"]

[tool.ruff.lint]
# Conservative starting set: pyflakes plus the pycodestyle rules that catch real
# errors rather than formatting noise (Black owns formatting).  Widen this
# deliberately -- adding `I` (import sorting) or `UP` (pyupgrade) rewrites many
# files and belongs in its own commit, not mixed with logic changes.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    # Assigned-but-unused is common in this codebase's step-by-step pipeline
    # code where intermediate values document the flow.  Revisit later.
    "F841",
    # FastAPI's `Query(...)` / `Body(...)` / `Depends(...)` parameter defaults are
    # the framework's documented idiom (21 uses in ui/server.py), not the bug
    # B008 describes.
    "B008",

    # ---- Deferred, not dismissed -------------------------------------------
    # 39 real findings from the first lint run.  Each changes runtime behaviour
    # or touches exception handling, so they belong in a reviewed follow-up
    # rather than mixed into the tooling commit (plan item 4.2).  Tracked as
    # item 4.12 in docs/plan/04-code-quality.md -- remove these entries as each
    # is addressed.
    "B904",  # 19x: `raise ... from e` inside except -- loses exception chaining
    "B007",  # 11x: unused loop control variable
    "B905",  # 5x:  zip() without explicit strict=
    "E722",  # 4x:  bare `except:` also swallows KeyboardInterrupt/SystemExit
]

[tool.ruff.lint.per-file-ignores]
# Re-exports: __init__ files intentionally import names they do not use.
"__init__.py" = ["F401"]
"src/text2sql_eval_toolkit/__init__.py" = ["F401", "E402"]
# Scripts load .env before importing the toolkit, so imports follow code.
"scripts/**" = ["E402"]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Default run is hermetic: no network, no credentials, no databases.
# Opt in with `pytest -m integration` (and the env the tests document).
addopts = "-m 'not integration' --strict-markers"
markers = [
    "integration: requires live LLM/database credentials or network access",
]

[tool.mypy]
# Deliberately no `python_version` pin: forcing 3.11 makes mypy parse third-party
# stubs (numpy) under 3.11 rules, and those stubs use PEP 695 syntax, which
# aborts the run.  mypy therefore checks against the interpreter it runs on
# (3.13 in CI).  The 3.11 floor is enforced where it actually matters -- the test
# matrix runs on 3.11 -- which is a stronger guarantee than a static assumption.
# Narrow initial scope, widened module by module as annotations land.
# See docs/plan/04-code-quality.md item 4.2.
files = [
    "src/text2sql_eval_toolkit/results",
    "src/text2sql_eval_toolkit/utils.py",
    "src/text2sql_eval_toolkit/env_loader.py",
    "src/text2sql_eval_toolkit/config_args.py",
]
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["src/text2sql_eval_toolkit"]
omit = ["*/data/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
