#
# Publishes the documentation site to GitHub Pages on every push to main.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions". Until that is
# done this workflow builds successfully and fails at the deploy step, which is
# the harmless half.
#
# The site is also built on every PR by the `docs` job in ci.yml, so a broken
# reference is caught before merge rather than here.

name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build
        run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
