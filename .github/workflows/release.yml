#
# Publishes to PyPI and creates the GitHub Release when a v* tag is pushed.
#
# One push, three jobs, no manual step:
#
#   build   -- build, check the tag matches the packaged version, check the
#              wheel carries its UI and judge configs, `twine check`, and
#              extract this version's release notes from CHANGELOG.md. A tag
#              with no changelog section fails here, before anything is
#              published.
#   publish -- Trusted Publishing to PyPI, gated on the `pypi` environment.
#   github-release -- the Release page, from those notes, with the wheel and
#              sdist attached.
#
# The third job is new in 1.5.0. Before it, the Release page was written by
# hand after the tag, and it was forgotten on both 1.3.0 and 1.4.0 -- nothing
# failed when it was missed, which is why it kept being missed.
#
# Authentication is PyPI Trusted Publishing (OIDC): the workflow exchanges a
# short-lived GitHub identity token for an upload token at publish time. No API
# token is stored in the repository, and nothing here can be replayed elsewhere.
#
# One-time setup, on PyPI under the project's Publishing settings, before the
# first tag: owner `IBM`, repository `text2sql-eval-toolkit`, workflow
# `release.yml`, environment `pypi`.
#
# Rehearsal. A workflow_dispatch runs all three jobs: it publishes to TestPyPI
# (the default), skipping a version already there so it can be re-run, and
# creates the Release as a draft under a throwaway name, then deletes it. The
# `gh release create` it runs is the same step a tag runs, so a broken Release
# job fails the rehearsal instead of the next real tag. Until 1.6.0 that job was
# skipped on dispatch, which is how it reached the 1.5.0 tag never having run.
# CONTRIBUTING.md says how to rehearse and what a rehearsal does not cover.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish to TestPyPI instead of PyPI"
        type: boolean
        default: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Tag must match the packaged version
        # A tag that disagrees with pyproject.toml publishes a version nobody
        # asked for, and PyPI will not let it be replaced afterwards.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.whl | sed -E 's/.*-([0-9][^-]*)-py3.*/\1/')
          echo "tag=$tag  built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag $tag does not match built version $built"
            exit 1
          fi

      - name: The wheel must carry its data and its UI
        # Same contract the CI workflow checks on every PR, re-checked here
        # because publishing it wrong is not reversible.
        run: |
          python - <<'PY'
          import sys, zipfile, glob
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          required = [
              "text2sql_eval_toolkit/evaluation/llm_judge_config/llm_judge_default_config.yaml",
              "text2sql_eval_toolkit/data/benchmarks.json",
              "text2sql_eval_toolkit/ui/static/index.html",
          ]
          missing = [p for p in required if p not in names]
          for p in missing:
              print(f"::error::missing from wheel: {p}")
          sys.exit(1 if missing else 0)
          PY

      - name: Metadata renders on PyPI
        run: twine check dist/*

      - name: Release notes exist for this version
        # Checked *here*, in the job before `publish`, because publishing is
        # irreversible: a tag with no changelog section must stop the release,
        # not produce a PyPI version alongside an empty Release page. The
        # extraction happens once, and the notes travel to the release job as an
        # artifact so both are reading the same bytes.
        #
        # A rehearsal has no tag, so it extracts the section for the version in
        # pyproject.toml -- the one the next tag would publish.
        #
        # `scripts/ci/extract_changelog.py` has tests; this step is the reason
        # it is a script rather than shell inside this file.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          fi
          python scripts/ci/extract_changelog.py "$version" -o release-notes.md
          echo "--- release notes for $version ---"
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment is the gate: add required reviewers to it on GitHub and a
    # release waits for a human before the irreversible step.
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.testpypi) && 'testpypi' || 'pypi' }}
      url: https://pypi.org/p/text2sql-eval-toolkit
    permissions:
      id-token: write # required for Trusted Publishing; nothing else is granted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.testpypi) && 'https://test.pypi.org/legacy/' || '' }}
          # A rehearsal publishes the version in pyproject.toml, which an
          # earlier rehearsal may already have put on TestPyPI; refusing it
          # would stop the run before the Release job it exists to reach. Never
          # on PyPI, where an existing version means something is wrong.
          skip-existing: ${{ github.event_name == 'workflow_dispatch' && inputs.testpypi }}

  github-release:
    name: GitHub Release
    # After `publish`, never beside it. A Release page pointing at a version
    # PyPI rejected is worse than a missing one.
    needs: publish
    # A tag creates the Release. A workflow_dispatch rehearses it -- the same
    # `gh release create`, as a draft under a throwaway name, deleted at the
    # end of the job -- so this job is exercised before a tag depends on it.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # The only thing this job needs, and the only thing it gets. Kept as
      # narrow as the publish job's `id-token: write`.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # This job downloads artifacts and never checks the repository out, so
      # there is no git remote for `gh` to infer the repository from -- and it
      # exited "not a git repository" on the 1.5.0 tag, after PyPI had already
      # published. Naming the repository is cheaper than cloning one just to
      # give `gh` its bearings.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create the Release
        # One step for both, so the rehearsal runs the command a tag runs and
        # not a lookalike that could drift from it.
        #
        # On a tag, --verify-tag refuses to invent a tag if the ref is somehow
        # not one. On a rehearsal, --draft keeps the page invisible and creates
        # no tag; the next step deletes it. The wheel and sdist are attached so
        # the page is a complete record of what was published rather than only
        # a pointer at PyPI.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            flags=(--verify-tag)
          else
            tag="rehearsal-${GITHUB_RUN_ID}"
            flags=(--draft --target "$GITHUB_SHA")
          fi
          gh release create "$tag" "${flags[@]}" \
            --title "$tag" \
            --notes-file release-notes.md \
            dist/*.whl dist/*.tar.gz

      - name: Delete the rehearsal's draft
        # always(): a rehearsal whose later checks fail must still not leave a
        # draft behind. A delete that fails fails the job, for the same reason.
        #
        # No --cleanup-tag. A draft creates no tag, so there is nothing to
        # clean up, and asking for it made the first rehearsal fail with HTTP
        # 422 on a ref that does not exist -- after the draft itself was gone.
        if: always() && !startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="rehearsal-${GITHUB_RUN_ID}"
          if gh release view "$tag" --json isDraft,assets \
               --jq '{isDraft, assets: [.assets[].name]}'; then
            gh release delete "$tag" --yes
            echo "deleted draft $tag"
          else
            echo "no draft $tag to delete"
          fi
