#
# Phase A of the refactor plan (docs/plan/04-code-quality.md, item 4.4).
# Before this workflow existed, nothing ran tests or linting on a PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep every job hermetic: no .env discovery, no credential-dependent paths.
  TEXT2SQL_DATA_ROOT: ${{ github.workspace }}/data

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install tooling
        # Lint tools only -- no project dependencies needed, so this job stays fast.
        run: python -m pip install --upgrade pip ruff black
      - name: Ruff
        run: ruff check src tests scripts --output-format=github
      - name: Black
        run: black --check --diff src tests scripts
      - name: Version agreement
        # pyproject, the installed package, the changelog and the tag. This
        # drifted once already and nothing noticed for months.
        run: python scripts/ci/check_version.py

  consistency:
    # Two files in this repo are generated from another; both have silently
    # drifted before. Checking is cheaper than noticing later.
    name: Generated files in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Packaged benchmark registries
        # The checkout copy shadows the packaged one, so drift is invisible in
        # development and only reaches pip-installed users.
        run: python scripts/curation/sync_packaged_registry.py --check
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: uv.lock matches pyproject.toml
        # An export can agree with a lockfile that has itself fallen behind the
        # project's declared dependencies.
        run: uv lock --check
      - name: requirements.txt matches uv.lock
        run: |
          uv export --format requirements-txt --no-hashes --no-dev \
            --no-emit-project -o /tmp/requirements.expected
          # Compare package lines only: our header and uv's banner differ by
          # design, and comments carry no dependency information.
          grep -E '^[a-zA-Z0-9]' requirements.txt | sort > /tmp/have.txt
          grep -E '^[a-zA-Z0-9]' /tmp/requirements.expected | sort > /tmp/want.txt
          if ! diff -u /tmp/want.txt /tmp/have.txt; then
            echo "::error::requirements.txt is stale. Regenerate it (see its header)."
            exit 1
          fi

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dashboard]"
      - name: Mypy
        # Scope is narrow by design and widens module by module; see
        # docs/plan/04-code-quality.md item 4.2.
        run: mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dashboard]"
      - name: Pytest
        # pyproject's addopts excludes `integration`, so this needs no
        # credentials, no database, and no network.
        run: pytest --cov --cov-report=xml --cov-report=json --cov-report=term-missing
      - name: Coverage floors
        # Per-module minimums for the code where being wrong is expensive:
        # published metrics, the artifact index, and authorization. The
        # project-wide fail_under in pyproject is only a backstop.
        run: python scripts/ci/check_coverage.py
      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  e2e:
    name: End-to-end (shareable links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install the toolkit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dashboard]"
      - name: Install frontend dependencies
        working-directory: dashboard
        run: npm ci
      - name: Install Chromium
        working-directory: dashboard
        # Only the one browser: these tests are about routing and history, not
        # cross-browser rendering, and three engines would triple the download
        # for no additional signal.
        run: npx playwright install --with-deps chromium
      - name: Build the dashboard
        # The tests run against dashboard/dist, so this must be the build under
        # test rather than the committed one.
        working-directory: dashboard
        run: npm run build
      - name: Playwright
        working-directory: dashboard
        run: npx playwright test
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: dashboard/test-results/
          if-no-files-found: ignore
          retention-days: 7

  test-next:
    # Non-blocking early warning for the next interpreter. Promote into `test`
    # once dependency wheels (psycopg2-binary, ibm_watsonx_ai) are confirmed.
    name: Tests (py3.14, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dashboard]"
      - name: Pytest
        run: pytest

  container:
    # The deployment image is unverified until something builds it. Compose
    # config is validated too, so a typo there fails here rather than on the VM.
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose configuration
        run: |
          docker compose -f deploy/docker-compose.yml --profile databases config \
            --quiet
        env:
          DASHBOARD_DOMAIN: example.org
          ACME_EMAIL: ci@example.org
          POSTGRES_SUPERUSER_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: text2sql-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        # Public mode needs no credentials and no data, so this checks the image
        # actually starts and serves rather than merely compiles.
        run: |
          docker run -d --name dash -p 8000:8000 \
            -e TEXT2SQL_DASHBOARD_MODE=public \
            text2sql-dashboard:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/me > /tmp/me.json; then break; fi
            sleep 2
          done
          cat /tmp/me.json
          grep -q '"tier":"public"' /tmp/me.json
          # A privileged endpoint must be refused in the deployed configuration.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"sql":"SELECT 1"}' \
            http://127.0.0.1:8000/api/benchmarks/demo/execute)
          echo "execute -> $code"
          [ "$code" = "403" ]
      - name: Container logs on failure
        if: failure()
        run: docker logs dash || true

  frontend:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        # Blocking. `vite build` does not type-check, so without this an
        # undefined identifier in JSX ships and only fails when that view is
        # opened -- which is exactly what happened once on this branch.
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle size budget
        # Budgets the *entry* chunk, not the sum of all JS: route views are
        # code-split and load on demand, so summing every chunk would hide the
        # thing this guards. Baseline after splitting: ~401 KB entry, ~826 KB CSS.
        # See docs/plan/02-performance.md item 2.8.
        run: |
          budget_entry=460
          budget_css=900
          entry=$(du -k dist/assets/index-*.js | sort -rn | head -1 | cut -f1)
          css=$(du -ck dist/assets/*.css | tail -1 | cut -f1)
          lazy=$(find dist/assets -name "*.js" | wc -l | tr -d ' ')
          echo "entry ${entry} KB (budget ${budget_entry} KB) across ${lazy} JS chunks"
          echo "CSS ${css} KB (budget ${budget_css} KB)"
          fail=0
          if [ "$entry" -gt "$budget_entry" ]; then
            echo "::error::entry chunk ${entry} KB exceeds budget ${budget_entry} KB"
            fail=1
          fi
          if [ "$css" -gt "$budget_css" ]; then
            echo "::error::CSS ${css} KB exceeds budget ${budget_css} KB"
            fail=1
          fi
          exit $fail
      - name: Verify committed dist is current
        # dashboard/dist is committed and served by text2sql-eval-dashboard, so a
        # stale build silently ships different UI than the source. See
        # docs/plan/03-public-deployment.md item 3.6.
        run: |
          # Content-hashed filenames mean any real change shows as deleted+untracked,
          # so check porcelain status rather than `git diff` alone.
          changed=$(git status --porcelain -- dist)
          if [ -n "$changed" ]; then
            echo "::warning::dashboard/dist differs from a fresh build of dashboard/src."
            echo "Run 'cd dashboard && npm run build' and commit the result."
            echo "$changed"
          fi
